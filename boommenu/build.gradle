plugins {
    id 'com.android.library'
}

android {
    namespace = "com.nightonke.boommenu"

    compileSdk = 36

    defaultConfig {
        minSdk = 26
        targetSdk=  36
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11  // Khớp với app
        targetCompatibility = JavaVersion.VERSION_11  // Khớp với app
    }

    // THÊM buildFeatures nếu cần
    buildFeatures {
        viewBinding = true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.recyclerview:recyclerview:1.4.0"

    // Nếu app dùng material 1.13.0, thì module cũng nên dùng
    implementation "com.google.android.material:material:1.13.0"

    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
}
